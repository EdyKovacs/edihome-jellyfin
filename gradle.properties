# Gradle
org.gradle.jvmargs=-Xmx2048m

# Home Assistant "lights off" button (item details screen)
# Leave ha.webhook.url empty to hide the button.
# Create the webhook trigger in Home Assistant first: Settings > Automations > New > Trigger: Webhook.
# ha.webhook.url=http://homeassistant.local:8123/api/webhook/jellyfin-lights-off
# Optional long-lived access token, only needed when you call the REST API instead of a webhook.
# ha.token=

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default
